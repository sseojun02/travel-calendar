<style>
:root{--accent:#C6DCF3;--deep:#5A7DA3;--tint:#E3EDF9;--soft:#EEF4FB;--on:#16181D;
--ink:#16181D;--ink2:#3A3F4A;--muted:#5F6673;--line:#E9EAEE;--line2:#F0F1F4;--bg:#F4F5F7;
--shadow:0 1px 2px rgba(22,24,29,.04),0 6px 16px rgba(22,24,29,.06)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{font-family:'Noto Sans KR',Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.num{font-family:Inter,'Noto Sans KR',sans-serif}
.shell{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--bg)}
.layer{display:contents}
.main{position:relative;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 116px);display:flex;flex-direction:column;gap:16px}
.main>*{flex-shrink:0}
.card{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:24px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.5px}
h2{margin:0;font-size:17px;font-weight:700}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.link{font-size:13px;font-weight:500;color:var(--muted);background:none;border:0;padding:6px 0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#C9CDD4}
.ibtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:#fff;box-shadow:0 1px 2px rgba(22,24,29,.05),0 3px 8px rgba(22,24,29,.06);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;color:var(--ink);text-decoration:none}
.chip{height:34px;padding:0 13px;border-radius:17px;border:1px solid #E6E8EC;background:#fff;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;background:var(--bg);padding:4px 9px;border-radius:999px;white-space:nowrap}
.btn{height:46px;padding:0 18px;border:0;border-radius:23px;background:var(--ink);color:#fff;font-size:14px;font-weight:700;white-space:nowrap}
.ai-entry{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:18px;border:1px solid var(--line);background:#fff;text-align:left;font-size:14px;color:var(--ink2)}
.ai-entry .spk{width:36px;height:36px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--deep);flex-shrink:0}
.ai-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:#fff;text-align:left}
.ai-item.off{opacity:.45}
.ai-item .k{font-size:11px;font-weight:700;color:var(--deep);background:var(--soft);border-radius:8px;padding:3px 7px;flex-shrink:0}
.sheet.chat{height:88%;max-height:88%;padding-bottom:0;gap:0;overflow:hidden}
.ai-head{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 10px}
.ai-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px 14px;-webkit-overflow-scrolling:touch}
.bub{max-width:86%;padding:10px 14px;border-radius:20px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.bub.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.bub.ai{align-self:flex-start;background:var(--bg);color:var(--ink);border-bottom-left-radius:6px}
.ai-card{align-self:stretch;display:flex;flex-direction:column;gap:8px;padding-left:2px}
.ai-bar{display:flex;align-items:flex-end;gap:8px;padding:10px 0 calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
.ai-bar textarea{flex:1;min-height:44px;max-height:120px;height:44px;border:1px solid #E6E8EC;border-radius:22px;background:var(--bg);padding:11px 16px;font-size:16px;line-height:1.35;resize:none;font-family:inherit}
.ai-send{width:44px;height:44px;border-radius:22px;border:0;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ai-send:disabled{opacity:.35}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:3px;background:#9AA0AA;animation:dt 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,80%,100%{opacity:.3}40%{opacity:1}}
.tt{position:relative;margin-left:0}
.tt-hour{position:absolute;left:0;right:0;height:0;border-top:1px solid #E6E8EC}
.tt-hour span{position:absolute;left:0;top:-8px;width:40px;text-align:right;font-size:11px;font-weight:600;color:var(--muted);background:var(--bg);padding-right:4px}
.tt-half{position:absolute;left:48px;right:0;height:0;border-top:1px dashed #EEF0F3}
.tt-b{position:absolute;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(22,24,29,.05);padding:6px 10px;overflow:hidden;display:flex;flex-direction:column;gap:1px;text-align:left;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;cursor:pointer}
.tt-b.drag{z-index:4;box-shadow:0 8px 24px rgba(22,24,29,.18);transform:scale(1.02);transition:transform .12s}
.tt-b .t{font-size:13px;font-weight:700;line-height:1.3;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-b .m{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-b .grip{position:absolute;left:50%;bottom:3px;width:26px;height:4px;margin-left:-13px;border-radius:2px;background:rgba(22,24,29,.18)}
.tt-b.main .t::before{content:"★ ";color:inherit}
.tt-mv{position:absolute;display:flex;align-items:center;gap:4px;padding:0 8px;font-size:11px;font-weight:600;color:var(--ink2);border-left:2px dashed #C9CED6;text-decoration:none;overflow:hidden;white-space:nowrap}
.tt-mv.short{color:#A35A12;border-left-color:#E3A55B}
.tt-now{position:absolute;left:44px;right:0;height:0;border-top:2px solid var(--deep);z-index:3}
.tt-now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:5px;background:var(--deep)}
.seg2{display:inline-flex;background:#ECEEF1;border-radius:18px;padding:3px}
.seg2 button{height:30px;padding:0 12px;border-radius:15px;border:0;background:transparent;font-size:12px;font-weight:600;color:var(--ink2)}
.seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(22,24,29,.08)}
.sw{width:34px;height:34px;border-radius:17px;border:2px solid transparent;padding:0;display:inline-flex;align-items:center;justify-content:center}
.sw.on{border-color:var(--ink)}
.legtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.legtabs::-webkit-scrollbar{display:none}
.legtabs button{flex-shrink:0;height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legtabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.legtabs button .d{font-size:11px;font-weight:500;opacity:.7}

.btn.soft{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.accent{background:var(--accent);color:var(--on)}
.btn.danger{background:#FCEBEB;color:#A32D2D}
.field{width:100%;height:48px;border:1px solid #E6E8EC;border-radius:14px;background:var(--bg);padding:0 14px;font-size:16px}
textarea.field{height:auto;min-height:80px;padding:12px 14px;resize:vertical}
.flabel{font-size:12px;font-weight:700;color:var(--ink2);margin:0 0 6px 4px;display:block}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row2>*{min-width:0}
input[type=date].field,input[type=time].field{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;line-height:46px}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{opacity:.6}
.seg{display:grid;gap:4px;padding:5px;border-radius:28px}
.seg button{border:0;background:transparent;border-radius:23px;font-size:14px;font-weight:500;color:var(--ink2);min-height:42px}
.seg button.on{background:var(--accent);color:var(--on);font-weight:700}
.list{padding:2px 16px}
.lrow{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line2)}
.lrow:last-child{border-bottom:0}
.check{width:26px;height:26px;border-radius:13px;border:2px solid #C9CDD4;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;color:#fff}
.check.on{background:var(--ink);border-color:var(--ink)}
.done{color:#8A909B;text-decoration:line-through}
.x{width:40px;height:40px;border:0;background:transparent;border-radius:20px;color:#9AA0AA;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.empty{padding:18px;font-size:14px;color:var(--muted);text-align:center}
.nav{position:fixed;left:max(14px,calc(50% - 226px));right:max(14px,calc(50% - 226px));z-index:5;bottom:calc(14px + env(safe-area-inset-bottom));height:64px;border-radius:32px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 4px rgba(22,24,29,.05),0 10px 24px rgba(22,24,29,.10);display:flex;align-items:center;padding:0 6px;z-index:5}
.nav button{flex:1;height:52px;border-radius:26px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px;font-weight:500;padding:0}
.nav button.on{background:var(--accent);color:var(--on);font-weight:700}
.fab{position:fixed;z-index:5;right:max(22px,calc(50% - 218px));bottom:calc(94px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:28px;border:0;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 8px rgba(22,24,29,.10),0 10px 22px rgba(22,24,29,.14);z-index:4}
.overlay{position:fixed;inset:0;background:rgba(22,24,29,.35);display:flex;align-items:flex-end;z-index:10}
.sheet{background:#fff;width:100%;max-height:90%;overflow-y:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:3px;background:#DADDE1;margin:2px auto 0}
.sheet h3{margin:0;font-size:18px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.daytabs{display:flex;gap:4px;overflow-x:auto;padding:5px;border-radius:28px;scrollbar-width:none}
.daytabs::-webkit-scrollbar{display:none}
.daytabs button{min-width:76px;flex:1 0 auto;height:48px;border-radius:24px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);padding:0 10px}
.daytabs button.on{background:var(--accent);color:var(--on)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
.cal-cell{height:50px;border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:20px;z-index:20;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
</style>

  try { window.scrollTo(0, keepScroll); } catch (e) {}
  document.documentElement.style.overflow = ui.sheet ? 'hidden' : ''; document.body.style.overflow = ui.sheet ? 'hidden' : '';
  lastTab = ui.tab;
  fitVV();
  var aiBox2 = document.getElementById('ai-msgs'); if (aiBox2 && aiScroll != null) aiBox2.scrollTop = aiAtEnd ? aiBox2.scrollHeight : aiScroll;
  var aiTa2 = document.getElementById('ai-text'); if (aiTa2) { aiGrow(aiTa2); if (aiFocus) { try { aiTa2.focus({preventScroll: true}); var L = aiTa2.value.length; aiTa2.setSelectionRange(L, L); } catch (e) {} } }
  if (activeBind && !ui.sheet) {
    var el = app.querySelector('[data-bind="' + activeBind + '"]');
    if (el) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch (e) {} }
  }
}

/* ---------- events ---------- */
function readForm(form) { var o = {}; Array.prototype.forEach.call(form.querySelectorAll('[name]'), function (el) { o[el.name] = el.value.trim(); }); return o; }
function showErr(id, msg) { var e = document.getElementById(id); if (e) e.textContent = msg; }
function validTrip(f, errId, noTitle) {
  if (!f.country) { showErr(errId, '나라를 골라 주세요'); return false; }
  if (!cityFromForm(f)) { showErr(errId, '도시를 골라 주세요'); return false; }
  if (!noTitle && !f.title) f.title = cityFromForm(f) + ' 여행';
  if (!f.start || !f.end) { showErr(errId, '출발일과 도착일을 골라 주세요'); return false; }
  if (f.end < f.start) { showErr(errId, '도착일이 출발일보다 빨라요'); return false; }
  if (Math.round((parseD(f.end) - parseD(f.start)) / 86400000) > 59) { showErr(errId, '여행은 60일까지 만들 수 있어요'); return false; }
  return true;
}

var A = {
  tab: function (el) { ui.tab = el.dataset.tab; ui.sheet = null; ui.adjUndo = null; render(); },
  openDay: function (el) { ui.day = el.dataset.date; ui.tab = 'timeline'; render(); },
  leg: function (el) { ui.leg = el.dataset.id === 'all' ? 'all' : el.dataset.id; ui.day = null; render(); },
  day: function (el) { ui.day = el.dataset.date; render(); },
  month: function (el) { var m = ui.calM + Number(el.dataset.d), y = ui.calY; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } ui.calM = m; ui.calY = y; render(); },
  calSel: function (el) { ui.calSel = el.dataset.date; render(); },
  toggleTodo: function (el) { var t = S.todos.filter(function (x) { return x.id === el.dataset.id; })[0]; if (t) { t.done = !t.done; commit(); } },
  delTodo: function (el) { S.todos = S.todos.filter(function (x) { return x.id !== el.dataset.id; }); commit('할 일을 지웠어요'); },
  todoFilter: function (el) { ui.todoFilter = el.dataset.f; render(); },
  draftDate: function (el) { ui.draft.date = el.dataset.date; render(); },
  spendCat: function (el) { ui.spend.cat = el.dataset.c; render(); },
  delSpend: function (el) { S.spends = S.spends.filter(function (x) { return x.id !== el.dataset.id; }); commit('지출을 지웠어요'); },
  theme: function (el) { S.settings.theme = el.dataset.k; commit(); },
  toggleSet: function (el) { S.settings[el.dataset.k] = !S.settings[el.dataset.k]; commit(); },
  sheet: function (el) { if (el.dataset.type === 'ai') { ui.ai.err = ''; } ui.sheet = {type: el.dataset.type, id: el.dataset.id || null, date: el.dataset.date || null}; render(); if (el.dataset.type === 'ai') { aiAfterRender(true); return; } var f = document.querySelector('.sheet input:not([type=hidden]), .sheet select'); if (f && !el.dataset.id) try { f.focus(); } catch (e) {} },
  adjustDay: function (el) {
    var d = el.dataset.date, snap = JSON.stringify(stopsOn(d).map(function (x) { return [x.id, x.start, x.end]; }));
    var r = adjustDay(d), r2 = adjustDay(d); r.moved += r2.moved;
    ui.adjUndo = {date: d, snap: snap, msg: r.moved + '곳 시간을 맞췄어요' + (r.stuck ? ' · 예약 때문에 못 맞춘 곳 ' + r.stuck + '곳' : '')};
    commit(r.moved ? '이동 시간에 맞춰 시간을 조정했어요' : '조정할 곳이 없었어요');
  },
  undoAdjust: function () {
    var u = ui.adjUndo; if (!u) return;
    JSON.parse(u.snap).forEach(function (a) { var x = S.stops.filter(function (y) { return y.id === a[0]; })[0]; if (x) { x.start = a[1]; x.end = a[2]; } });
    ui.adjUndo = null; commit('되돌렸어요');
  },
  tlView: function (el) { S.settings.tlView = el.dataset.v; commit(); },
  recalcMoves: function (el) { stopsOn(el.dataset.date).forEach(function (x) { if (x.moveAuto || !x.move) { x.moveKey = ''; x.moveAuto = true; x.move = ''; } }); moveFailAt = 0; lsSet(); render(); scheduleMoves(0); },
  closeSheet: function () { ui.sheet = null; render(); },
  aiToggle: function (el) { var m = ui.ai.msgs[+el.dataset.m], x = m && m.actions[+el.dataset.i]; if (x && !m.applied) { var box = document.getElementById('ai-msgs'), st = box ? box.scrollTop : 0; x.on = !x.on; render(); box = document.getElementById('ai-msgs'); if (box) box.scrollTop = st; } },
  aiApply: function (el) { var m = ui.ai.msgs[+el.dataset.m]; if (!m || m.applied) return; var n = aiApply(m); m.applied = n || -1; if (n <= 0) m.applied = 0; commit(n ? n + '개를 반영했어요' : '반영할 항목이 없었어요'); },
  overlay: function (el, e) { if (e.target === el) { ui.sheet = null; render(); } },
  pickChip: function (el) { var g = el.parentNode; Array.prototype.forEach.call(g.querySelectorAll('.chip'), function (c) { c.classList.toggle('on', c === el); }); var hid = g.parentNode.querySelector('input[type=hidden]'); if (hid) hid.value = el.dataset.v; },
  sheetDelete: function () {
    var sh = ui.sheet;
    if (sh.type === 'stop') S.stops = S.stops.filter(function (x) { return x.id !== sh.id; });
    if (sh.type === 'booking') S.bookings = S.bookings.filter(function (x) { return x.id !== sh.id; });
    if (sh.type === 'stay') { var sl = (sh.id && legById(sh.id)) || curLeg(); sl.stay = {}; syncStayStops(sl); }
    if (sh.type === 'leg') { var dl2 = legById(sh.id); if (dl2) { S.stops = S.stops.filter(function (x) { return x.auto !== 'in:' + dl2.id && x.auto !== 'out:' + dl2.id; }); S.trip.legs = S.trip.legs.filter(function (l) { return l.id !== sh.id; }); if (ui.leg === sh.id) ui.leg = null; syncTripRange(); } }
    ui.sheet = null; commit('삭제했어요');
  },
  signIn: function () { signIn(); },
  useLocal: function () { localMode = true; loaded = true; syncStatus = 'local'; render(); },
  signOut: function () { firebase.auth().signOut().then(function () { S = null; lastSaved = ''; try { localStorage.removeItem(LS_KEY); } catch (e) {} ui.tab = 'home'; localMode = false; render(); }); },
  loadSample: function () { S = sampleState(); ui = Object.assign(ui, {tab: 'home', day: null, calY: null, calSel: null, leg: null}); ensureLegs(); commit('예시 여행을 불러왔어요'); },
  doReset: function () { S = null; ui.sheet = null; ui.tab = 'home'; ui.day = null; ui.calY = null; ui.calSel = null; try { localStorage.removeItem(LS_KEY); } catch (e) {} if (ref) { lastSaved = ''; ref.delete().catch(function () {}); } render(); },
  copyJson: function () {
    var txt = JSON.stringify(S, null, 2);
    try { navigator.clipboard.writeText(txt).then(function () { toast('백업을 복사했어요'); render(); }, function () { toast('복사가 막혀 있어요'); render(); }); } catch (e) { toast('복사가 막혀 있어요'); render(); }
  }
};

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || !document.getElementById('app').contains(el)) return;
  var f = A[el.dataset.act];
  if (f) { if (el.tagName === 'BUTTON' && el.type !== 'submit') e.preventDefault(); f(el, e); }
});

document.addEventListener('submit', function (e) {
  var form = e.target, kind = form.getAttribute('data-form');
  e.preventDefault();
  if (kind === 'todoAdd') {
    var txt = ui.draft.text.trim(); if (!txt) { document.getElementById('todo-text').focus(); return; }
    S.todos.push({id: nid(), text: txt, date: ui.draft.date || '', done: false}); ui.draft.text = ''; commit('할 일을 추가했어요');
    var tt = document.getElementById('todo-text'); if (tt) tt.focus();
  } else if (kind === 'spendAdd') {
    var n = parseFloat(String(ui.spend.amt).replace(/,/g, ''));
    if (!(n > 0)) { var p = document.getElementById('sp-preview'); if (p) { p.textContent = '금액을 먼저 입력해 주세요'; p.style.color = '#A32D2D'; } return; }
    var today = nowIn(curLeg().tz).date;
    S.spends.unshift({id: nid(), amt: n, cur: ui.spend.cur, cat: ui.spend.cat, memo: ui.spend.memo.trim(), date: today});
    ui.spend.amt = ''; ui.spend.memo = ''; commit('지출을 기록했어요');
  } else if (kind === 'createTrip') {
    var f = readForm(form); if (!validTrip(f, 'f-err')) return;
    S = emptyState({title: f.title, country: f.country, city: cityFromForm(f), start: f.start, end: f.end, currency: f.currency, tz: f.tz, homeTz: 'Asia/Seoul', budget: 0, stay: {}}); ensureLegs();
    ui.tab = 'home'; commit('여행을 만들었어요');
  } else if (kind === 'sheet') {
    var sh = ui.sheet, v = readForm(form);
    if (sh.type === 'ai') {
      aiSend(); return;
    }
    if (sh.type === 'stop') {
      if (!v.title) { showErr('sheet-err', '장소나 할 것을 적어 주세요'); return; }
      if (v.start && v.end && v.end < v.start) { showErr('sheet-err', '끝나는 시간이 시작보다 빨라요'); return; }
      var rec = {date: v.date, start: v.start, end: v.end, title: v.title, place: v.place, q: v.q, cat: v.cat || 'sight', booked: v.booked, move: v.move, note: v.note, color: v.color || ''};
      if (sh.id) { var s = S.stops.filter(function (x) { return x.id === sh.id; })[0]; if (s) { if (!v.move) { rec.moveAuto = false; rec.moveKey = ''; } else if (v.move !== s.move) { rec.moveAuto = false; } Object.assign(s, rec); } }
      else S.stops.push(Object.assign({id: nid()}, rec));
      ui.day = v.date;
    } else if (sh.type === 'todo') {
      if (!v.text) { showErr('sheet-err', '할 일을 적어 주세요'); return; }
      S.todos.push({id: nid(), text: v.text, date: v.date || '', done: false});
    } else if (sh.type === 'booking') {
      if (!v.name) { showErr('sheet-err', '이름을 적어 주세요'); return; }
      if (v.url && !/^https?:\/\//i.test(v.url)) { showErr('sheet-err', '링크는 https:// 로 시작해야 해요'); return; }
      var br = {name: v.name, date: v.date, time: v.time, kind: v.kind, url: v.url};
      if (sh.id) { var b = S.bookings.filter(function (x) { return x.id === sh.id; })[0]; if (b) Object.assign(b, br); }
      else S.bookings.push(Object.assign({id: nid()}, br));
    } else if (sh.type === 'stay') {
      if (v.inDate && v.outDate && v.outDate < v.inDate) { showErr('sheet-err', '체크아웃이 체크인보다 빨라요'); return; }
      var sl2 = (sh.id && legById(sh.id)) || curLeg();
      sl2.stay = {name: v.name, address: v.address, inDate: v.inDate, checkin: v.checkin, outDate: v.outDate, checkout: v.checkout};
      syncStayStops(sl2);
    } else if (sh.type === 'trip') {
      S.trip.title = v.title || S.trip.title;
    } else if (sh.type === 'leg') {
      if (!validTrip(v, 'f-err', true)) return;
      var rec2 = {country: v.country, city: cityFromForm(v), start: v.start, end: v.end, currency: v.currency, tz: v.tz};
      var ex2 = sh.id && legById(sh.id);
      if (ex2) Object.assign(ex2, rec2); else { ex2 = Object.assign({id: nid(), stay: {}}, rec2); S.trip.legs.push(ex2); }
      syncTripRange(); ui.leg = ex2.id;
      ui.calY = null; ui.calSel = null; ui.spend.cur = null;
    }
    ui.sheet = null; commit('저장했어요');
  }
});

document.addEventListener('input', function (e) {
  var b = e.target.getAttribute && e.target.getAttribute('data-bind'); if (!b) return;
  var v = e.target.value;
  if (b === 'draft.text') ui.draft.text = v;
  else if (b === 'spend.amt') { ui.spend.amt = v; var p = document.getElementById('sp-preview'); if (p) { p.style.color = ''; p.textContent = spendPreview(parseFloat(String(v).replace(/,/g, '')), ui.spend); } }
  else if (b === 'spend.memo') ui.spend.memo = v;
  else if (b === 'ai.text') { ui.ai.text = v; aiGrow(e.target); }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'f-country') { onCountryPicked(e.target.form); return; }
  if (e.target.id === 'f-city') { onCityPicked(e.target.form); return; }
  var b = e.target.getAttribute && e.target.getAttribute('data-bind'); if (!b) return;
  var v = e.target.value;
  if (b === 'draft.date') { ui.draft.date = v; render(); }
  else if (b === 'spend.cur') { ui.spend.cur = v; render(); }
  else if (b === 'trip.tz' || b === 'trip.homeTz') { S.trip[b.split('.')[1]] = v; commit(); }
  else if (b === 'leg.tz') { curLeg().tz = v; syncTripRange(); commit(); }
  else if (b === 'trip.budget') { var n = parseInt(String(v).replace(/[^0-9]/g, ''), 10); S.trip.budget = n > 0 ? n : 0; commit('예산을 바꿨어요'); }
  else if (b === 'rate') { var r = parseFloat(String(v).replace(/,/g, '')); var rc = e.target.getAttribute('data-cur') || curLeg().currency; var c = CURRENCIES[rc] || CURRENCIES.EUR; if (r > 0) { S.rates = S.rates || {}; S.rates[rc] = r / c.unit; commit('환율을 바꿨어요'); } }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && ui.sheet) { ui.sheet = null; render(); return; }
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229 && e.target && e.target.id === 'ai-text' && !/Mobi|iPhone|Android/i.test(navigator.userAgent)) { e.preventDefault(); aiSend(); }
});

/* 키보드가 올라와도 시트가 보이는 영역에 맞춰지게 */
function fitVV() {
  var o = document.querySelector('.overlay'); if (!o) return;
  var vv = window.visualViewport, sh = document.querySelector('.shell'), r = sh ? sh.getBoundingClientRect() : {left: 0, width: window.innerWidth};
  o.style.position = 'fixed'; o.style.left = r.left + 'px'; o.style.width = r.width + 'px'; o.style.right = 'auto'; o.style.bottom = 'auto';
  o.style.top = (vv ? vv.offsetTop : 0) + 'px'; o.style.height = (vv ? vv.height : window.innerHeight) + 'px';
  var box = document.getElementById('ai-msgs'); if (box && document.activeElement && document.activeElement.id === 'ai-text') box.scrollTop = box.scrollHeight;
}
if (window.visualViewport) { window.visualViewport.addEventListener('resize', fitVV); window.visualViewport.addEventListener('scroll', fitVV); }
window.addEventListener('resize', fitVV);
document.addEventListener('focusin', function (e) { if (e.target && e.target.closest && e.target.closest('.sheet')) { setTimeout(fitVV, 60); setTimeout(fitVV, 350); } });

/* clocks tick without writing anything */
setInterval(function () { if (S && !ui.sheet && (ui.tab === 'timeline' || ui.tab === 'settings')) { var a = document.activeElement; if (!a || a === document.body) render(); } }, 30000);

/* ---------- start ---------- */
S = lsGet();
if (S && !S.trip) S = null;
render();
connect();
setTimeout(function () { scheduleMoves(0); }, 4000);
})();
</script>
